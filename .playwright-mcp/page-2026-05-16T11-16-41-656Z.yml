          - generic [ref=e81]: "9th May 2026 WebRTC is designed to degrade and drop my prompt during poor network conditions. wtf my dude WebRTC aggressively drops audio packets to keep latency low. If you’ve ever heard distorted audio on a conference call, that’s WebRTC baybee. The idea is that conference calls depend on rapid back-and-forth, so pausing to wait for audio is unacceptable. …but as a user, I would much rather wait an extra 200ms for my slow/expensive prompt to be accurate. After all, I’m paying good money to boil the ocean, and a garbage prompt means a garbage response. It’s not like LLMs are particularly responsive anyway. But I’m not allowed to wait. It’s impossible to even retransmit a WebRTC audio packet within a browser; we tried at Discord. The implementation is hard-coded for real-time latency or else. — [Luke Curley](https://moq.dev/blog/webrtc-is-the-problem/), OpenAI’s WebRTC Problem, in response to [How OpenAI delivers low-latency voice AI at scale](https://openai.com/index/delivering-low-latency-voice-ai-at-scale/) Recent articles [Notes on the xAI/Anthropic data center deal](/2026/May/7/xai-anthropic/)- 7th May 2026[Live blog: Code w/ Claude 2026](/2026/May/6/code-w-claude-2026/)- 6th May 2026[Vibe coding and agentic engineering are getting closer than I'd like](/2026/May/6/vibe-coding-and-agentic-engineering/)- 6th May 2026"

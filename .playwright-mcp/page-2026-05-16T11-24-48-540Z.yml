          - generic [ref=e80]: "Today we're launching The Small Brief, an initiative bringing together four ad industry icons to champion a local businesses they love. Their mission is to build breakthrough, studio-quality campaigns that elevate incredible businesses while highlighting the storytelling power of AI and inspiring other creatives and small businesses to explore it for themselves. We gave the creatives unlimited access to [Flow](https://labs.google/fx/tools/flow?gad_source=1&gad_campaignid=23723143563&gbraid=0AAAABDRA0IWZIhU955BDMZqlZNWIQiOrS&gclid=CjwKCAjw-8vPBhBbEiwAoA39WgVpNYUb0769dEYsyrRzuIWQh8FcBILs42nOiujgYDD4RIh_R2jeHRoCU94QAvD_BwE), Google’s AI creative studio, to bring these brand stories to life. Here are the icons and the businesses they're supporting. - Jayanta Jenkins: [Archangels](https://www.archangels.me/) - Tiffany Rolfe: [South Ferry](https://www.southferry.com/) - Susan Credle: [Stonewood Farm](https://stonewoodny.org/) Google's AI tools [help small businesses](https://blog.google/company-news/outreach-and-initiatives/small-business/ai-for-small-businesses) achieve big-brand impact by empowering them to create studio-quality ads with their unique voice and style, find their next customers and streamline workflows. We’ll reveal the final campaigns and share a deeper look into each creative's process in June."

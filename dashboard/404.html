<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Not Found | News Aggregator</title>
    <meta name="description" content="The page you're looking for doesn't exist." />
    <meta name="robots" content="noindex,follow" />
    <meta name="theme-color" content="#0f6b8a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=4" />
    <style>
      .error-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }

      .error-code {
        font-size: clamp(6rem, 15vw, 12rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
        letter-spacing: -0.05em;
      }

      .error-title {
        font-size: clamp(1.5rem, 4vw, 2rem);
        font-weight: 600;
        margin: 16px 0 8px;
        color: var(--ink);
      }

      .error-message {
        font-size: 1rem;
        color: var(--ink-soft);
        max-width: 400px;
        margin: 0 0 32px;
        line-height: 1.5;
      }

      .error-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .error-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 12px;
        font: 600 0.95rem/1 "Inter", sans-serif;
        text-decoration: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .error-btn-primary {
        background: var(--accent);
        color: white;
        border: none;
      }

      .error-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px var(--glow-color);
      }

      .error-btn-secondary {
        background: transparent;
        color: var(--ink-soft);
        border: 1px solid var(--line);
      }

      .error-btn-secondary:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .error-illustration {
        width: 120px;
        height: 120px;
        margin-bottom: 24px;
        opacity: 0.8;
      }

      .error-illustration svg {
        width: 100%;
        height: 100%;
        stroke: var(--accent);
      }
    </style>
  </head>
  <body class="no-search">
    <div class="error-container">
      <div class="error-illustration">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 15h8"/>
          <path d="M9 9h.01"/>
          <path d="M15 9h.01"/>
        </svg>
      </div>
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page not found</h2>
      <p class="error-message">
        The page you're looking for doesn't exist or has been moved. 
        Check the URL or head back to the feed.
      </p>
      <div class="error-actions">
        <a href="./" class="error-btn error-btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18h-5"/>
            <path d="M18 14h-8"/>
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/>
            <rect width="8" height="4" x="10" y="6" rx="1"/>
          </svg>
          Go to Feed
        </a>
        <a href="javascript:history.back()" class="error-btn error-btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
          Go Back
        </a>
      </div>
    </div>
  </body>
</html>

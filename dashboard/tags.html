<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <link
      rel="alternate"
      type="application/atom+xml"
      title="News Aggregator Atom Feed"
      href="https://largelanguagemeowing.github.io/news/feed.atom"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="News Curator" />
    <meta property="og:title" content="News Curator | Tag Cloud" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="tags-page">
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <main class="shell">
      <header class="hero">
        <p class="kicker">News Curator</p>
        <h1>Tag Cloud</h1>
        <p id="tagMeta">Loading...</p>
        <nav class="top-nav">
          <a class="nav-item" href="./index.html">Feed Items</a>
          <a class="nav-item" href="./health.html">Health Dashboard</a>
          <a class="nav-item active" href="./tags.html">Tag Cloud</a>

            >Atom Feed</a
          >
        </nav>
      </header>

      <section class="grid metrics" id="tagStats"></section>

      <section class="panel">
        <h2>Tag Landscape</h2>
        <p class="result-meta">Size reflects frequency. Click any tag to jump into filtered feed items.</p>
        <div id="tagCloud" class="tag-cloud stage"></div>
      </section>

      <section class="panel">
        <h2>Top Tags</h2>
        <div id="topTagsList" class="tag-rank-list"></div>
      </section>
    </main>
    <script src="./tags.js"></script>
  </body>

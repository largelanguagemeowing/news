<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health and Dashboard</title>
    <meta name="description" content="Monitor source health, incident state, run timelines, and event quality in one dashboard." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0f6b8a" />
    <link rel="canonical" href="https://largelanguagemeowing.github.io/news/health.html" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="News Aggregator Atom Feed"
      href="https://largelanguagemeowing.github.io/news/feed.atom"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="News Curator" />
    <meta property="og:title" content="News Curator | Health Dashboard" />
    <meta property="og:description" content="Track feed uptime, incidents, and processing run reliability." />
    <meta property="og:url" content="https://largelanguagemeowing.github.io/news/health.html" />
    <meta property="og:image" content="https://largelanguagemeowing.github.io/news/meta/og-health.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="News Curator | Health Dashboard" />
    <meta name="twitter:description" content="Track feed uptime, incidents, and processing run reliability." />
    <meta name="twitter:image" content="https://largelanguagemeowing.github.io/news/meta/og-health.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <main class="shell">
      <header class="hero">
        <p class="kicker">News Curator</p>
        <h1>Health and Dashboard</h1>
        <p id="generatedAt">Loading...</p>
        <nav class="top-nav">
          <a class="nav-item" href="./index.html"><img class="nav-icon" src="./icons/newspaper.svg" alt="" /><span>Feed Items</span></a>
          <a class="nav-item active" href="./health.html"><img class="nav-icon" src="./icons/heart-pulse.svg" alt="" /><span>Health Dashboard</span></a>
          <a class="nav-item" href="./tags.html"><img class="nav-icon" src="./icons/tags.svg" alt="" /><span>Tag Cloud</span></a>
          <a class="nav-item" href="https://largelanguagemeowing.github.io/news/feed.atom" target="_blank" rel="noreferrer"
            ><img class="nav-icon" src="./icons/rss.svg" alt="" /><span>Atom Feed</span></a
          >
        </nav>
      </header>

      <section class="grid metrics" id="metrics"></section>

      <section class="panel">
        <h2><img class="section-icon" src="./icons/activity.svg" alt="" /><span>Source Health</span></h2>
        <p class="result-meta">Status history appears automatically once a source has more than one check.</p>
        <div class="table-wrap">
          <table id="sourcesTable">
            <thead>
              <tr>
                <th>Source</th>
                <th>Status</th>
                <th>Last Success</th>
                <th>Failures</th>
                <th>Latency</th>
                <th>History</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <h2><img class="section-icon" src="./icons/triangle-alert.svg" alt="" /><span>Open Incidents</span></h2>
        <ul id="incidentsList" class="cards"></ul>
      </section>

      <section class="panel">
        <h2><img class="section-icon" src="./icons/history.svg" alt="" /><span>Recent Runs</span></h2>
        <ul id="runsList" class="cards"></ul>
      </section>

      <section class="panel">
        <h2><img class="section-icon" src="./icons/calendar-clock.svg" alt="" /><span>Recent Events</span></h2>
        <ul id="eventsList" class="cards"></ul>
      </section>
    </main>
    <script src="./health.js"></script>
  </body>
</html>

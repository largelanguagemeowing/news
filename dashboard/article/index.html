    <style>
      .article-page { padding: 24px; max-width: 1200px; margin: 0 auto; }
      .article-back { margin-bottom: 16px; }
      .article-back a {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 14px; font-weight: 500; color: var(--ink-soft);
        text-decoration: none;
      }
      .article-back a:hover { color: var(--ink); }

      .article-title {
        font-size: 26px; font-weight: 700; line-height: 1.3;
        margin: 0 0 24px 0;
      }

      .article-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 24px;
        align-items: start;
      }

      .article-sidebar {
        display: flex;
        flex-direction: column;
      }

      .article-sidebar-section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }

      .article-sidebar-section + .article-sidebar-section {
        margin-top: 8px;
      }

      .sidebar-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--ink-soft);
        margin-bottom: 6px;
      }

      .sidebar-value {
        font-size: 14px;
        color: var(--ink);
        line-height: 1.5;
      }

      .sidebar-value a {
        color: var(--accent);
        text-decoration: none;
      }
      .sidebar-value a:hover { text-decoration: underline; }

      .sidebar-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .sidebar-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 500;
        background: color-mix(in srgb, var(--accent) 12%, var(--panel));
        color: var(--accent);
        text-decoration: none;
      }
      .sidebar-tag:hover {
        background: color-mix(in srgb, var(--accent) 20%, var(--panel));
      }

      .sidebar-original {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        color: var(--accent);
        text-decoration: none;
      }
      .sidebar-original:hover { text-decoration: underline; }

      .article-body-wrap {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
        min-height: 300px;
      }

      .article-not-found {
        text-align: center; padding: 60px 20px; color: var(--ink-soft);
      }
      .article-not-found h2 { font-size: 20px; margin: 0 0 8px 0; }

      @media (max-width: 760px) {
        .article-layout {
          grid-template-columns: 1fr;
        }
        .article-page { padding: 16px; }
        .article-title { font-size: 22px; }
      }
    </style>

    <style>
      .videos-header {
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        padding: 20px 24px 0; flex-wrap: wrap;
      }
      .videos-header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
      .videos-search {
        flex: 1; max-width: 360px;
        padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel); color: var(--ink);
        font-size: 14px; font-family: inherit;
        outline: none; transition: border-color 0.2s;
      }
      .videos-search:focus { border-color: var(--accent); }
      .videos-search::placeholder { color: var(--ink-soft); }

      .videos-sort {
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel); color: var(--ink);
        font-size: 13px; font-family: inherit; cursor: pointer;
        outline: none;
      }
      .videos-filter {
        padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel); color: var(--ink);
        font-size: 13px; font-family: inherit; cursor: pointer;
        outline: none;
      }

      .videos-count {
        font-size: 13px; color: var(--ink-soft); padding: 0 24px; margin: 8px 0 0;
      }

      .videos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px;
        padding: 16px 24px;
      }

      .video-card {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden;
        transition: transform 0.15s;
      }
      .video-card:hover { transform: translateY(-2px); }

      .video-thumb {
        position: relative;
        background: var(--line);
        overflow: hidden;
      }
      .video-thumb img {
        width: 100%; height: auto; object-fit: contain;
        display: block;
      }
      .video-thumb-fallback {
        display: flex; align-items: center; justify-content: center;
        height: 100%; color: var(--ink-soft); font-size: 13px;
      }
      .video-duration {
        position: absolute; bottom: 6px; right: 6px;
        padding: 2px 6px; border-radius: 4px;
        font-size: 11px; font-weight: 500;
        background: rgba(0,0,0,0.7); color: #fff;
        text-transform: capitalize;
      }

      .video-body {
        padding: 10px 12px 14px;
      }
      .video-meta-row {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 4px;
      }
      .video-channel {
        font-size: 12px; color: var(--ink-soft); text-decoration: none;
      }
      .video-channel:hover { color: var(--ink); }
      .video-meta-date {
        font-size: 12px; color: var(--ink-soft);
      }
      .video-title {
        font-size: 14px; font-weight: 600; line-height: 1.35;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; margin: 0;
      }
      .video-title a {
        color: var(--ink); text-decoration: none;
      }
      .video-title a:hover { color: var(--accent); }

      .videos-loader {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 16px; padding: 16px 24px;
      }
      .video-card-skeleton {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden;
      }
      .video-card-skeleton .skeleton-thumb {
        aspect-ratio: 16 / 9;
      }
      .video-card-skeleton .skeleton-body {
        padding: 10px 12px 14px;
      }
      .video-card-skeleton .skeleton-meta-row {
        display: flex; gap: 8px; margin-bottom: 6px;
      }
      .video-card-skeleton .skeleton-meta-row .skeleton {
        height: 12px; border-radius: 4px;
      }
      .video-card-skeleton .skeleton-meta-row .skeleton:first-child { width: 80px; }
      .video-card-skeleton .skeleton-meta-row .skeleton:last-child { width: 60px; }
      .video-card-skeleton .skeleton-lines { display: flex; flex-direction: column; gap: 6px; }
      .video-card-skeleton .skeleton-lines .skeleton { height: 14px; }
      .video-card-skeleton .skeleton-lines .skeleton:first-child { width: 90%; }
      .video-card-skeleton .skeleton-lines .skeleton:last-child { width: 70%; }

      .videos-empty {
        text-align: center; padding: 80px 24px; color: var(--ink-soft);
      }
      .videos-empty h2 { font-size: 20px; margin: 0 0 8px; }

      @media (max-width: 760px) {
        .videos-header { padding: 16px 16px 0; flex-direction: column; align-items: stretch; }
        .videos-header-left { flex-direction: column; align-items: stretch; }
        .videos-search { max-width: none; }
        .videos-grid { padding: 12px 16px; grid-template-columns: 1fr; }
        .videos-loader { padding: 12px 16px; grid-template-columns: 1fr; }
        .videos-count { padding: 0 16px; }
      }
    </style>

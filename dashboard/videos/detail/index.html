    <style>
      .video-detail-container {
        max-width: 960px;
        margin: 0 auto;
        padding: 20px 24px;
      }

      .video-detail-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--ink-soft);
        text-decoration: none;
        margin-bottom: 16px;
      }
      .video-detail-back:hover { color: var(--ink); }
      .video-detail-back svg { width: 18px; height: 18px; }

      .video-detail-embed {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
      }
      .video-detail-embed iframe {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: 0;
      }

      .video-detail-info {
        padding: 16px 0;
      }
      .video-detail-title {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.35;
        margin: 0 0 12px;
        color: var(--ink);
      }
      .video-detail-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        font-size: 14px;
        color: var(--ink-soft);
      }
      .video-detail-channel {
        font-weight: 500;
        color: var(--ink);
        text-decoration: none;
      }
      .video-detail-channel:hover { color: var(--accent); }
      .video-detail-separator {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--ink-soft);
      }
      .video-detail-youtube-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--accent);
        text-decoration: none;
        margin-top: 12px;
      }
      .video-detail-youtube-link:hover { text-decoration: underline; }

      .video-detail-not-found {
        text-align: center;
        padding: 80px 24px;
        color: var(--ink-soft);
      }
      .video-detail-not-found h2 {
        font-size: 20px;
        margin: 0 0 8px;
        color: var(--ink);
      }

      @media (max-width: 760px) {
        .video-detail-container { padding: 16px; }
        .video-detail-title { font-size: 18px; }
      }
    </style>

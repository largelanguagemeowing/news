<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      body { font-family: "Space Grotesk", sans-serif; }
      .mono { font-family: "IBM Plex Mono", monospace; }
    </style>
  </head>
  <body class="m-0 h-[630px] w-[1200px] overflow-hidden bg-slate-950">
    <div class="relative h-full w-full bg-gradient-to-br from-sky-300/20 via-slate-900 to-cyan-500/25 p-14">
      <div class="absolute -right-24 -top-24 h-72 w-72 rounded-full bg-cyan-400/30 blur-3xl"></div>
      <div class="absolute -left-16 bottom-0 h-64 w-64 rounded-full bg-sky-400/25 blur-3xl"></div>
      <div class="relative flex h-full flex-col justify-between rounded-3xl border border-white/15 bg-slate-900/70 p-12 text-white">
        <div class="mono text-[22px] tracking-[0.14em] text-cyan-200">NEWS CURATOR</div>
        <div>
          <h1 class="max-w-4xl text-7xl font-bold leading-[1.04]">Feed Items</h1>
          <p class="mt-6 max-w-3xl text-3xl text-slate-200">
            Search, filter, and surface the most important AI updates.
          </p>
        </div>
        <div class="mono text-2xl text-slate-300">largelanguagemeowing.github.io/news</div>
      </div>
    </div>
  </body>
</html>

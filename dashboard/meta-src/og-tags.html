<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
    </style>
  </head>
  <body class="m-0 h-[630px] w-[1200px] overflow-hidden bg-[#edf2f7]">
    <!-- Subtle gradient background matching site theme -->
    <div class="relative h-full w-full">
      <!-- Soft radial gradients like the site -->
      <div class="absolute inset-0">
        <div class="absolute right-[15%] top-[10%] h-[400px] w-[400px] rounded-full bg-[#dce3f7] opacity-60 blur-3xl"></div>
        <div class="absolute left-[10%] top-[25%] h-[350px] w-[350px] rounded-full bg-[#d5e6ef] opacity-50 blur-3xl"></div>
        <div class="absolute bottom-[5%] left-[20%] h-[300px] w-[300px] rounded-full bg-[#e8f0f8] opacity-40 blur-3xl"></div>
      </div>

      <!-- Main content card -->
      <div class="relative flex h-full items-center justify-center p-16">
        <div class="relative w-full max-w-[1000px] rounded-3xl border border-[#cfd9e3] bg-[#f9fcff]/90 p-14 shadow-[0_8px_40px_rgba(18,32,43,0.08)] backdrop-blur-sm">
          <!-- Accent corner decoration - violet for tags -->
          <div class="absolute -right-3 -top-3 h-24 w-24 rounded-2xl bg-gradient-to-br from-[#7c3aed] to-[#5b21b6] opacity-90"></div>
          <div class="absolute -right-1 -top-1 h-20 w-20 rounded-xl bg-[#f9fcff]"></div>

          <!-- Top label -->
          <div class="mono mb-8 inline-flex items-center gap-2 rounded-full bg-[#7c3aed]/10 px-4 py-2 text-sm font-semibold tracking-wider text-[#7c3aed] uppercase">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/>
              <circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/>
            </svg>
            Discovery
          </div>

          <!-- Main heading -->
          <h1 class="mb-6 text-7xl font-extrabold tracking-tight text-[#12202b]">
            Tag Cloud
          </h1>

          <!-- Description -->
          <p class="max-w-2xl text-2xl font-medium leading-relaxed text-[#4f5f6f]">
            Explore trending topics and jump into filtered news streams by category.
          </p>

          <!-- Sample tag pills -->
          <div class="mt-8 flex flex-wrap gap-3">
            <span class="mono rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold text-[#0f6b8a]">#AI</span>
            <span class="mono rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold text-[#0f6b8a]">#LLM</span>
            <span class="mono rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold text-[#0f6b8a]">#OpenAI</span>
            <span class="mono rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold text-[#0f6b8a]">#Research</span>
            <span class="mono rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold text-[#0f6b8a]">#Tools</span>
          </div>

          <!-- Bottom URL bar -->
          <div class="mt-10 flex items-center gap-3 border-t border-[#cfd9e3] pt-8">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gradient-to-br from-[#7c3aed] to-[#5b21b6] text-white">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <span class="mono text-lg text-[#4f5f6f]">largelanguagemeowing.github.io/news</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

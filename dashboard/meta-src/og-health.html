<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
    </style>
  </head>
  <body class="m-0 h-[630px] w-[1200px] overflow-hidden bg-[#edf2f7]">
    <!-- Subtle gradient background matching site theme -->
    <div class="relative h-full w-full">
      <!-- Soft radial gradients like the site -->
      <div class="absolute inset-0">
        <div class="absolute left-[8%] top-[20%] h-[400px] w-[400px] rounded-full bg-[#d5e6ef] opacity-60 blur-3xl"></div>
        <div class="absolute right-[12%] top-[12%] h-[350px] w-[350px] rounded-full bg-[#e8f0f8] opacity-50 blur-3xl"></div>
        <div class="absolute bottom-[10%] right-[20%] h-[300px] w-[300px] rounded-full bg-[#dce3f7] opacity-40 blur-3xl"></div>
      </div>

      <!-- Main content card -->
      <div class="relative flex h-full items-center justify-center p-16">
        <div class="relative w-full max-w-[1000px] rounded-3xl border border-[#cfd9e3] bg-[#f9fcff]/90 p-14 shadow-[0_8px_40px_rgba(18,32,43,0.08)] backdrop-blur-sm">
          <!-- Accent corner decoration - green for health -->
          <div class="absolute -right-3 -top-3 h-24 w-24 rounded-2xl bg-gradient-to-br from-[#1f7e3a] to-[#166628] opacity-90"></div>
          <div class="absolute -right-1 -top-1 h-20 w-20 rounded-xl bg-[#f9fcff]"></div>

          <!-- Top label -->
          <div class="mono mb-8 inline-flex items-center gap-2 rounded-full bg-[#1f7e3a]/10 px-4 py-2 text-sm font-semibold tracking-wider text-[#1f7e3a] uppercase">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/>
              <path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
            </svg>
            System Status
          </div>

          <!-- Main heading -->
          <h1 class="mb-6 text-7xl font-extrabold tracking-tight text-[#12202b]">
            Health Dashboard
          </h1>

          <!-- Description -->
          <p class="max-w-2xl text-2xl font-medium leading-relaxed text-[#4f5f6f]">
            Monitor feed reliability, track incidents, and view run status over time.
          </p>

          <!-- Status indicators -->
          <div class="mt-8 flex gap-4">
            <div class="flex items-center gap-2 rounded-full bg-[#1f7e3a]/10 px-4 py-2">
              <div class="h-3 w-3 rounded-full bg-[#1f7e3a]"></div>
              <span class="mono text-sm font-semibold text-[#1f7e3a]">Healthy</span>
            </div>
            <div class="flex items-center gap-2 rounded-full bg-[#9a5b17]/10 px-4 py-2">
              <div class="h-3 w-3 rounded-full bg-[#9a5b17]"></div>
              <span class="mono text-sm font-semibold text-[#9a5b17]">Degraded</span>
            </div>
            <div class="flex items-center gap-2 rounded-full bg-[#a2232b]/10 px-4 py-2">
              <div class="h-3 w-3 rounded-full bg-[#a2232b]"></div>
              <span class="mono

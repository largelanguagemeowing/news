<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .mono {
        font-family: "IBM Plex Mono", monospace;
      }
    </style>
  </head>
  <body class="m-0 h-[630px] w-[1200px] overflow-hidden bg-[#edf2f7]">
    <div class="relative h-full w-full">
      <div class="absolute inset-0">
        <div class="absolute left-[12%] top-[15%] h-[400px] w-[400px] rounded-full bg-[#d5e6ef] opacity-60 blur-3xl"></div>
        <div class="absolute right-[10%] top-[8%] h-[350px] w-[350px] rounded-full bg-[#dce3f7] opacity-50 blur-3xl"></div>
        <div class="absolute bottom-0 left-1/2 h-[500px] w-[800px] -translate-x-1/2 rounded-full bg-[#e8f0f8] opacity-40 blur-3xl"></div>
      </div>

      <div class="relative flex h-full items-center justify-center p-16">
        <div class="relative w-full max-w-[1000px] overflow-hidden rounded-3xl border border-[#cfd9e3] bg-[#f9fcff]/90 p-14 shadow-[0_8px_40px_rgba(18,32,43,0.08)] backdrop-blur-sm">
          <div class="absolute left-0 right-0 top-0 h-1.5 bg-gradient-to-r from-[#0f6b8a] via-[#0a4f66] to-[#0f6b8a]"></div>

          <div class="mono mb-8 inline-flex items-center gap-2 rounded-full bg-[#0f6b8a]/10 px-4 py-2 text-sm font-semibold tracking-wider text-[#0f6b8a] uppercase">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m22 8-6 4 6 4V8Z"/>
              <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
            </svg>
            News Curator
          </div>

          <h1 class="mb-6 text-7xl font-extrabold tracking-tight text-[#12202b]">
            Video Library
          </h1>

          <p class="max-w-2xl text-2xl font-medium leading-relaxed text-[#4f5f6f]">
            Browse and watch AI news videos from top YouTube channels, all in one place.
          </p>

          <div class="mt-10 flex items-center gap-3 border-t border-[#cfd9e3] pt-8">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-gradient-to-br from-[#0f6b8a] to-[#0a4f66] text-white">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
            </div>
            <span class="mono text-lg text-[#4f5f6f]">largelanguagemeowing.github.io/news/videos</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

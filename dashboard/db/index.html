    <style>
      .db-explorer { padding: 24px; max-width: 1400px; margin: 0 auto; }
      .db-header { margin-bottom: 24px; }
      .db-header h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px 0; }
      .db-header p { color: var(--text-secondary); margin: 0; }
      
      .db-toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      
      .db-toolbar select, .db-toolbar input {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text-primary);
        font-size: 14px;
      }
      
      .db-toolbar select { min-width: 150px; }
      .db-toolbar input { min-width: 250px; flex: 1; }
      
      .db-toolbar button {
        padding: 8px 16px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }
      
      .db-toolbar button:hover { opacity: 0.9; }
      .db-toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
      
      .db-stats {
        display: flex;
        gap: 16px;
        margin-bottom: 16px;
        font-size: 13px;
        color: var(--text-secondary);
      }
      
      .db-table-container {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
      }
      
      .db-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      
      .db-table th {
        background: var(--surface-2);
        padding: 12px;
        text-align: left;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      
      .db-table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      
      .db-table tr:hover td { background: var(--surface-2); }
      .db-table tr:last-child td { border-bottom: none; }
      
      .db-table .col-id { width: 60px; }
      .db-table .col-source { width: 120px; }
      .db-table .col-method { width: 100px; }
      .db-table .col-date { width: 140px; }
      
      .db-loading {
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
      }
      
      .db-error {
        padding: 20px;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        color: #dc2626;
        margin: 20px 0;
      }
      
      .db-empty {
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
      }
      
      .pagination {
        display: flex;
        gap: 8px;
        justify-content: center;
        padding: 16px;
        border-top: 1px solid var(--border);
      }
      
      .pagination button {
        padding: 6px 12px;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      
      .pagination button:hover { background: var(--surface-2); }
      .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
      .pagination .page-info { padding: 6px 12px; color: var(--text-secondary); }
      
      .method-badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
        text-transform: uppercase;
      }
      .method-youtube { background: #fef3c7; color: #92400e; }
      .method-trafilatura { background: #dbeafe; color: #1e40af; }
      .method-markdown_new { background: #d1fae5; color: #065f46; }
      .method-jina { background: #fce7f3; color: #9d174d; }
      .method-defuddle { background: #f3e8ff; color: #6b21a8; }
      .method-rss { background: #f3f4f6; color: #4b5563; }
      
      .truncate-text { max-width: 400px; }
      .truncate-text:hover { white-space: normal; word-break: break-word; }
    </style>

    <!-- Main Content -->
    <main class="shell">
      <div class="db-explorer">
        <div class="db-header">
          <h1>Database Explorer</h1>
          <p>Browse and search all database tables using WASM SQLite</p>
        </div>

        <div class="db-toolbar">
          <select id="tableSelect">
            <option value="articles">Articles</option>
            <option value="sources">Sources</option>
            <option value="source_health">Source Health</option>
            <option value="events">Events</option>
            <option value="event_members">Event Members</option>
            <option value="pipeline_runs">Pipeline Runs</option>
            <option value="source_checks">Source Checks</option>
          </select>
          <input type="text" id="searchInput" placeholder="Search... (e.g., title, url, source_id)" />
          <select id="sourceFilter">
            <option value="">All Sources</option>
          </select>
          <select id="methodFilter">
            <option value="">All Methods</option>
            <option value="youtube">YouTube</option>
            <option value="trafilatura">Trafilatura</option>
            <option value="markdown_new">Markdown.new</option>
            <option value="jina">Jina</option>
            <option value="defuddle">Defuddle</option>
            <option value="rss">RSS</option>
          </select>
          <button id="loadBtn">Load Database</button>
          <button id="exportBtn" disabled>Export CSV</button>
        </div>

        <div class="db-stats" id="dbStats"></div>

        <div id="loadingState" class="db-loading" style="display: none;">
          <div>Loading SQLite WASM...</div>
          <div style="margin-top: 8px; font-size: 12px; color: var(--text-secondary);">Fetching database file</div>
        </div>

        <div id="errorState" class="db-error" style="display: none;"></div>

        <div class="db-table-container" id="tableContainer" style="display: none;">
          <table class="db-table" id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="pagination" id="pagination"></div>
        </div>

        <div id="emptyState" class="db-empty" style="display: none;">
          No data found. Click "Load Database" to fetch the data.
        </div>
      </div>
    </main>

    <script src="db.js"></script>

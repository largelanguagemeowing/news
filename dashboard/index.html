<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed Items | News Aggregator</title>
    <meta name="description" content="Explore curated AI feed items with search, topic filters, source filters, and tags." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0f6b8a" />
    <link rel="canonical" href="https://largelanguagemeowing.github.io/news/" />
    <link rel="alternate" type="application/atom+xml" title="News Aggregator Atom Feed" href="https://largelanguagemeowing.github.io/news/feed.atom" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="News Aggregator" />
    <meta property="og:title" content="News Aggregator | Feed Items" />
    <meta property="og:description" content="Browse feed items with source, topic, and tag filters." />
    <meta property="og:url" content="https://largelanguagemeowing.github.io/news/" />
    <meta property="og:image" content="https://largelanguagemeowing.github.io/news/meta/og-feed.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="News Aggregator | Feed Items" />
    <meta name="twitter:description" content="Browse feed items with source, topic, and tag filters." />
    <meta name="twitter:image" content="https://largelanguagemeowing.github.io/news/meta/og-feed.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="manifest" href="./manifest.json" />
    <script src="./app.js"></script>
  </head>
  <body>
    <!-- Fixed Header Bar -->
    <header class="top-bar">
      <div class="top-bar-inner">
        <a href="./feed/" class="brand">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M18 18h-8"/><path d="M18 10h-8"/></svg>
          </div>
          <span class="brand-text">Feed Items</span>
        </a>

        <nav class="main-nav desktop-nav" aria-label="Main navigation">
          <a class="nav-item active" href="./feed/">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg>
            <span>Feed</span>
          </a>
          <a class="nav-item" href="./health/">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
            <span>Health</span>
          </a>
          <a class="nav-item" href="./tags/">
            <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
            <span>Tags</span>
          </a>
          <a class="nav-item" href="./rss/">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
            <span>RSS</span>
          </a>
        </nav>
        
        <div class="header-actions">
          <div class="layout-switch header-layout-switch" role="tablist" aria-label="Feed layout">
            <button id="tableLayout" class="layout-btn active" type="button" aria-label="Table view" title="Table view">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M3 12h18"/><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            </button>
            <button id="timelineLayout" class="layout-btn" type="button" aria-label="Timeline view" title="Timeline view">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v6"/><circle cx="12" cy="12" r="3"/><path d="M12 15v6"/></svg>
            </button>
          </div>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
            <svg class="theme-icon-svg moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
            <svg class="theme-icon-svg sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Fixed Search Bar -->
    <div class="search-bar">
      <div class="search-bar-inner">
        <div class="search-input-wrap">
          <input id="searchInput" type="search" placeholder="Search titles, source, tags..." />
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <button class="filter-toggle" id="filterToggle" type="button" aria-label="Toggle filters">
          <svg class="filter-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span>Filters</span>
          <span class="filter-badge" id="filterBadge" hidden></span>
        </button>
      </div>
    </div>

    <!-- Collapsible Filter Panel -->
    <div class="filter-panel" id="filterPanel">
      <div class="filter-panel-inner">
        <div class="filters-grid">
          <div class="filter-group">
            <label for="sourceFilter">Source</label>
            <select id="sourceFilter">
              <option value="">All sources</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="topicFilter">Topic</label>
            <select id="topicFilter">
              <option value="">All topics</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="tagFilter">Tag</label>
            <select id="tagFilter">
              <option value="">All tags</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="filter-btn filter-btn-secondary" id="clearFilters" type="button">Clear Filters</button>
          <button class="filter-btn filter-btn-primary" id="applyFilters" type="button">Apply Filters</button>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <main class="shell">
      <div id="feedLoader" class="feed-loader">
        <div class="loader-spinner"></div>
        <p>Loading feed items...</p>
      </div>
      <div id="feedTimeline" class="timeline-root" aria-live="polite" hidden></div>
      <div class="table-wrap" id="feedTableWrap" hidden>
        <table id="feedsTable">
          <thead>
            <tr>
              <th>Published</th>
              <th>Source</th>
              <th>Topic</th>
              <th>Title</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    
    <!-- Mobile Bottom Navigation -->
    <nav class="main-nav mobile-nav" aria-label="Mobile navigation">
      <a class="nav-item active" href="./feed/">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18h-5"/><path d="M18 14h-8"/><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-4 0v-9a2 2 0 0 1 2-2h2"/><rect width="8" height="4" x="10" y="6" rx="1"/></svg>
        <span>Feed</span>
      </a>
      <a class="nav-item" href="./health/">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/><path d="M3.22 13H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        <span>Health</span>
      </a>
      <a class="nav-item" href="./tags/">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
        <span>Tags</span>
      </a>
      <a class="nav-item" href="./rss/">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
        <span>RSS</span>
      </a>
    </nav>
    
    <button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>
    <script src="./feeds.js?v=3"></script>
  </body>
</html>

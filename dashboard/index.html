<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed Items</title>
    <meta name="description" content="Explore curated AI feed items with search, topic filters, source filters, and tags." />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#0f6b8a" />
    <link rel="canonical" href="https://largelanguagemeowing.github.io/news/index.html" />
    <link
      rel="alternate"
      type="application/atom+xml"
      title="News Aggregator Atom Feed"
      href="https://largelanguagemeowing.github.io/news/feed.atom"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="News Curator" />
    <meta property="og:title" content="News Curator | Feed Items" />
    <meta property="og:description" content="Browse feed items with source, topic, and tag filters." />
    <meta property="og:url" content="https://largelanguagemeowing.github.io/news/index.html" />
    <meta property="og:image" content="https://largelanguagemeowing.github.io/news/meta/og-feed.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="News Curator | Feed Items" />
    <meta name="twitter:description" content="Browse feed items with source, topic, and tag filters." />
    <meta name="twitter:image" content="https://largelanguagemeowing.github.io/news/meta/og-feed.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <main class="shell">
      <header class="hero">
        <p class="kicker">News Curator</p>
        <h1>Feed Items</h1>
        <p id="feedMeta">Loading...</p>
        <nav class="top-nav">
          <a class="nav-item active" href="./index.html">Feed Items</a>
          <a class="nav-item" href="./health.html">Health Dashboard</a>
          <a class="nav-item" href="./tags.html">Tag Cloud</a>
          <a class="nav-item" href="https://largelanguagemeowing.github.io/news/feed.atom" target="_blank" rel="noreferrer"
            >Atom Feed</a
          >
        </nav>
      </header>

      <section class="grid metrics" id="feedStats"></section>

      <section class="panel">
        <h2>Latest Feed Stream</h2>
        <div class="filters" id="filters">
          <input id="searchInput" type="search" placeholder="Search titles, source, tags..." />
          <select id="sourceFilter">
            <option value="">All sources</option>
          </select>
          <select id="topicFilter">
            <option value="">All topics</option>
          </select>
          <select id="tagFilter">
            <option value="">All tags</option>
          </select>
          <button id="clearFilters" type="button">Clear</button>
        </div>
        <p class="result-meta" id="resultsMeta"></p>
        <div id="feedTimeline" class="timeline-root" aria-live="polite"></div>
      </section>
    </main>
    <script src="./feeds.js"></script>
  </body>
</html>

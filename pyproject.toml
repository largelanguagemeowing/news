[project]
name = "news-aggregator"
version = "0.1.0"
description = "Low-cost news curation pipeline with visibility-first GitHub Actions operations."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.13.5",
    "feedparser>=6.0.12",
    "joblib>=1.5.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.3",
    "readability-lxml>=0.8.4.1",
    "requests>=2.32.5",
    "tenacity>=8.5.0",
    "trafilatura>=2.0.0",
    "youtube-transcript-api>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

name: news-pipeline
run-name: "news-pipeline @ ${{ github.ref_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      enable_backfill:
        description: "Run Defuddle backfill for existing items"
        required: false
        default: false
        type: boolean
      backfill_all:
        description: "When backfill is enabled, process all missing/short items (ignore limit)"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-pipeline-single-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install defuddle CLI
        run: npm install -g defuddle@0.13.0

      - name: Run tests
        run: uv run pytest -q

      - name: Backfill Defuddle content (existing items)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_backfill }}
        env:
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: |
          if [ "${{ inputs.backfill_all }}" = "true" ]; then
            uv run python -m app.jobs.backfill_defuddle --all --only-missing
          else
            uv run python -m app.jobs.backfill_defuddle --limit 300 --only-missing
          fi

      - name: Run pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: uv run python -m app.jobs.pipeline

      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.db data/status
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): update pipeline artifacts"
            git push
          fi

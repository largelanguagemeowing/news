name: news-pipeline
run-name: "news-pipeline @ ${{ github.ref_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pipeline_source:
        description: "Pipeline: which sources to ingest"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - openai-only
          - non-openai
          - microsoft-ai-blog
          - google-ai-blog
          - google-deepmind-blog
          - openai-blog
          - apple-machine-learning
          - simon-willison
          - cursor-blog
          - cursor-changelog
          - matt-wolfe
          - fireship
          - ai-explained
          - hugging-face
      enable_backfill:
        description: "Run enriched backfill for existing items"
        required: false
        default: false
        type: boolean
      backfill_all:
        description: "When backfill is enabled, process all items (ignore limit)"
        required: false
        default: false
        type: boolean
      backfill_method:
        description: "Force specific extraction method"
        required: false
        type: choice
        default: "default"
        options:
          - default
          - youtube
          - trafilatura
          - markdown_new
          - jina
          - defuddle

concurrency:
  group: news-pipeline-single-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Print run parameters
        run: |
          echo "===== Pipeline Run Parameters ====="
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Trigger:          scheduled (cron)"
            echo "All inputs:       defaults (all sources, no backfill)"
          else
            echo "Trigger:          workflow_dispatch"
            echo "pipeline_source:  ${{ inputs.pipeline_source }}"
            echo "enable_backfill:  ${{ inputs.enable_backfill }}"
            echo "backfill_all:     ${{ inputs.backfill_all }}"
            echo "backfill_source:  follows pipeline_source"
            echo "backfill_method:  ${{ inputs.backfill_method }}"
          fi
          echo "ref:              ${{ github.ref_name }}"
          echo "==================================="

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download news.db from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release view news-db --json assets >/dev/null 2>&1; then
            gh release download news-db -p news.db -D data --clobber
            echo "Downloaded news.db ($(stat -c%s data/news.db) bytes)"
          else
            echo "No existing release found; starting with empty database"
            touch data/news.db
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install defuddle CLI
        run: npm install -g defuddle@0.13.0

      - name: Run tests
        run: uv run pytest -q

      - name: Backfill enriched content (existing items)
        id: backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_backfill }}
        env:
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: |
          CMD="uv run python -m app.jobs.backfill_defuddle"
          
          if [ "${{ inputs.backfill_all }}" = "true" ]; then
            CMD="$CMD --all"
          else
            CMD="$CMD --limit 300 --only-dirty"
          fi
          
          BACKFILL_SOURCE="${{ inputs.pipeline_source }}"
          if [ "$BACKFILL_SOURCE" = "non-openai" ]; then
            CMD="$CMD --exclude-source openai-blog"
          elif [ "$BACKFILL_SOURCE" = "openai-only" ]; then
            CMD="$CMD --source-id openai-blog"
          elif [ "$BACKFILL_SOURCE" != "all" ]; then
            CMD="$CMD --source-id $BACKFILL_SOURCE"
          fi
          
          if [ "${{ inputs.backfill_method }}" != "default" ]; then
            CMD="$CMD --only-method ${{ inputs.backfill_method }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Run pipeline
        id: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
          PIPELINE_SOURCE_ID: >-
            ${{
              github.event_name == 'workflow_dispatch'
              && inputs.pipeline_source != 'all'
              && inputs.pipeline_source != 'openai-only'
              && inputs.pipeline_source != 'non-openai'
              && inputs.pipeline_source
              || ''
            }}
          PIPELINE_EXCLUDE_SOURCE: >-
            ${{
              github.event_name == 'workflow_dispatch'
              && inputs.pipeline_source == 'non-openai'
              && 'openai-blog'
              || ''
            }}
        run: |
          # Handle openai-only by setting source ID directly
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.pipeline_source }}" = "openai-only" ]; then
            export PIPELINE_SOURCE_ID="openai-blog"
          fi
          uv run python -m app.jobs.pipeline

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status
          
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # Pull latest changes to avoid conflicts
            git pull --rebase || { echo "ERROR: Rebase conflict"; exit 1; }
            
            # Commit changes
            if [ "${{ steps.backfill.outcome }}" = "success" ] && [ "${{ inputs.enable_backfill }}" = "true" ]; then
              COMMIT_MSG="chore(data): save backfill and pipeline progress"
            else
              COMMIT_MSG="chore(data): update pipeline artifacts"
            fi
            git commit -m "$COMMIT_MSG" || { echo "ERROR: Commit failed"; exit 1; }
            git push || { echo "ERROR: Push failed"; exit 1; }
          fi

      - name: Upload news.db to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s data/news.db ]; then
            gh release view news-db >/dev/null 2>&1 || gh release create news-db --title "News Database" --notes "Managed by pipeline workflows"
            gh release delete-asset news-db news.db --yes 2>/dev/null || true
            gh release upload news-db data/news.db --clobber
            echo "Uploaded news.db to release"
          else
            echo "news.db is empty; skipping upload"
          fi

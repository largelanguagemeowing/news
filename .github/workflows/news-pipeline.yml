name: news-pipeline
run-name: "news-pipeline @ ${{ github.ref_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      enable_backfill:
        description: "Run enriched backfill for existing items"
        required: false
        default: false
        type: boolean
      backfill_all:
        description: "When backfill is enabled, process all items (ignore limit)"
        required: false
        default: false
        type: boolean
      backfill_source:
        description: "Filter backfill to specific source"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - microsoft-ai-blog
          - google-ai-blog
          - google-deepmind-blog
          - openai-blog
          - apple-machine-learning
          - simon-willison
          - cursor-blog
          - cursor-changelog
          - matt-wolfe
          - fireship
          - ai-explained
          - hugging-face
      backfill_method:
        description: "Force specific extraction method"
        required: false
        type: choice
        default: "default"
        options:
          - default
          - youtube
          - trafilatura
          - markdown_new
          - jina
          - defuddle

concurrency:
  group: news-pipeline-single-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: false

      - name: Install defuddle CLI
        run: npm install -g defuddle@0.13.0

      - name: Run tests
        run: uv run pytest -q

      - name: Backfill enriched content (existing items)
        id: backfill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_backfill }}
        env:
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: |
          CMD="uv run python -m app.jobs.backfill_defuddle"
          
          if [ "${{ inputs.backfill_all }}" = "true" ]; then
            CMD="$CMD --all"
          else
            CMD="$CMD --limit 300 --only-dirty"
          fi
          
          if [ "${{ inputs.backfill_source }}" != "all" ]; then
            CMD="$CMD --source-id ${{ inputs.backfill_source }}"
          fi
          
          if [ "${{ inputs.backfill_method }}" != "default" ]; then
            CMD="$CMD --only-method ${{ inputs.backfill_method }}"
          fi
          
          echo "Running: $CMD"
          $CMD

      - name: Run pipeline
        id: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: uv run python -m app.jobs.pipeline

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.db data/status
          
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # Pull latest changes to avoid conflicts
            git pull --rebase || echo "Rebase had conflicts, attempting to continue"
            
            # Commit changes
            if [ "${{ steps.backfill.outcome }}" = "success" ] && [ "${{ inputs.enable_backfill }}" = "true" ]; then
              COMMIT_MSG="chore(data): save backfill and pipeline progress"
            else
              COMMIT_MSG="chore(data): update pipeline artifacts"
            fi
            git commit -m "$COMMIT_MSG"
            git push
          fi

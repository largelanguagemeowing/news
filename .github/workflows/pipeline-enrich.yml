name: pipeline-enrich
run-name: "enrich @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Filter to specific source"
        required: false
        type: string
      exclude_source:
        description: "Exclude source(s), comma-separated"
        required: false
        type: string
      limit:
        description: "Max articles to process"
        required: false
        type: number
        default: 500
      all:
        description: "Process all matching articles (ignore limit)"
        required: false
        type: boolean
        default: false
      only_dirty:
        description: "Only process likely dirty bodies"
        required: false
        type: boolean
        default: false
      only_missing:
        description: "Only process articles with empty/short bodies"
        required: false
        type: boolean
        default: true
      method:
        description: "Force specific extraction method"
        required: false
        type: choice
        default: "default"
        options:
          - default
          - youtube
          - trafilatura
          - markdown_new
          - jina
          - defuddle

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward to latest
        run: git pull --ff-only

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Install defuddle CLI
        run: npm install -g defuddle@0.13.0
        env:
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"

      - name: Run enrich pipeline
        id: enrich
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFUDDLE_ENABLED: "1"
          DEFUDDLE_TIMEOUT_SECONDS: "20"
          DEFUDDLE_MAX_CHARS: "12000"
          LOG_LEVEL: "INFO"
        run: |
          echo "Params: source_id=${{ inputs.source_id }}, exclude_source=${{ inputs.exclude_source }}, limit=${{ inputs.limit }}, all=${{ inputs.all }}, only_dirty=${{ inputs.only_dirty }}, method=${{ inputs.method }}"
          
          CMD="uv run python -m app.jobs.enrich_pipeline"
          
          if [ -n "${{ inputs.source_id }}" ]; then
            CMD="$CMD --source-id ${{ inputs.source_id }}"
          fi
          
          if [ -n "${{ inputs.exclude_source }}" ]; then
            CMD="$CMD --exclude-source ${{ inputs.exclude_source }}"
          fi
          
          if [ "${{ inputs.all }}" = "true" ]; then
            CMD="$CMD --all"
          else
            CMD="$CMD --limit ${{ inputs.limit }}"
          fi
          
          if [ "${{ inputs.only_dirty }}" = "true" ]; then
            CMD="$CMD --only-dirty"
          fi
          
          if [ "${{ inputs.only_missing }}" = "true" ]; then
            CMD="$CMD --only-missing"
          else
            CMD="$CMD --no-only-missing"
          fi
          
          if [ "${{ inputs.method }}" != "default" ]; then
            CMD="$CMD --only-method ${{ inputs.method }}"
          fi

          CMD="$CMD --export"

          echo "Running: $CMD"
          $CMD

      - name: Generate Workflow Summary
        run: |
          echo "## Enrich Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Workflow Parameters" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Source** | ${{ inputs.source_id || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Exclude** | ${{ inputs.exclude_source || '—' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Limit** | ${{ inputs.all == 'true' && 'unlimited' || inputs.limit }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Method** | ${{ inputs.method != 'default' && inputs.method || 'default (priority chain)' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Only dirty** | ${{ inputs.only_dirty }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Only missing** | ${{ inputs.only_missing }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          LATEST=$(jq 'max_by(.ended_at // .started_at) // empty' data/status/runs.json 2>/dev/null)
          if [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
            METRICS=$(echo "$LATEST" | jq '.stage_stats[] | select(.stage_name=="enrich") | .metrics // empty')
            if [ -n "$METRICS" ] && [ "$METRICS" != "null" ]; then
              DURATION=$(echo "$METRICS" | jq -r '.duration_ms // 0 | tonumber | . / 1000 | floor')

              echo "### Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Source | Attempted | Enriched | Failed |" >> $GITHUB_STEP_SUMMARY
              echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

              echo "$METRICS" | jq -r '
                .per_source // {} | to_entries | sort_by(.key)[] |
                "| \(.key) | \(.value.attempted) | \(.value.enriched) | \(.value.failed) |"
              ' >> $GITHUB_STEP_SUMMARY

              TOTALS=$(echo "$METRICS" | jq -r '
                [.per_source // {} | to_entries[] | .value] |
                {attempted: map(.attempted) | add, enriched: map(.enriched) | add, failed: map(.failed) | add}
              ')
              T_ATT=$(echo "$TOTALS" | jq -r '.attempted // 0')
              T_ENR=$(echo "$TOTALS" | jq -r '.enriched // 0')
              T_FAIL=$(echo "$TOTALS" | jq -r '.failed // 0')
              echo "| **Total** | **$T_ATT** | **$T_ENR** | **$T_FAIL** |" >> $GITHUB_STEP_SUMMARY

              if [ "$(echo "$METRICS" | jq -r '.stopped_early // false')" = "true" ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "⚠️ **Stopped early** — markdown.new rate limit hit." >> $GITHUB_STEP_SUMMARY
              fi
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            RUN_ID=$(echo "$LATEST" | jq -r '.run_id // ""')
            GITHUB_URL=$(echo "$LATEST" | jq -r '.github_run_url // ""')
            if [ -n "$RUN_ID" ]; then
              echo "**Run ID:** \`$RUN_ID\`" >> $GITHUB_STEP_SUMMARY
            fi
            if [ -n "$GITHUB_URL" ] && [ "$GITHUB_URL" != "null" ]; then
              echo "[View workflow run]($GITHUB_URL)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.db data/status
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): save enrich pipeline progress"
            git pull --rebase || true
            git push
          fi
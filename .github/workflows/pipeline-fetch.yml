name: pipeline-fetch
run-name: "fetch @ ${{ github.ref_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pipeline_source:
        description: "Which sources to fetch"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - openai-only
          - non-openai
          - microsoft-ai-blog
          - google-ai-blog
          - google-deepmind-blog
          - openai-blog
          - apple-machine-learning
          - simon-willison
          - cursor-blog
          - cursor-changelog
          - matt-wolfe
          - fireship
          - ai-explained
          - hugging-face
          - anthropic-news
          - anthropic-engineering
          - anthropic-research
          - claude-blog
          - thinking-machines
      export:
        description: "Export status files after fetch (enables feed dashboard)"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download news.db from release
        run: |
          mkdir -p data
          if gh release view news-db --json assets >/dev/null 2>&1; then
            gh release download news-db -p news.db -D data --clobber
            echo "Downloaded news.db ($(stat -c%s data/news.db) bytes)"
          else
            echo "No existing release found; starting with empty database"
            touch data/news.db
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run fetch pipeline
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: "INFO"
          PIPELINE_SOURCE_ID: >-
            ${{
              inputs.pipeline_source != 'all'
              && inputs.pipeline_source != 'openai-only'
              && inputs.pipeline_source != 'non-openai'
              && inputs.pipeline_source
              || ''
            }}
          PIPELINE_EXCLUDE_SOURCE: >-
            ${{
              inputs.pipeline_source == 'non-openai'
              && 'openai-blog'
              || ''
            }}
        run: |
          echo "Params: pipeline_source=${{ inputs.pipeline_source }}, export=${{ inputs.export }}"
          
          if [ "${{ inputs.pipeline_source }}" = "openai-only" ]; then
            export PIPELINE_SOURCE_ID="openai-blog"
          fi
          if [ "${{ inputs.export }}" = "true" ]; then
            uv run python -m app.jobs.fetch_pipeline --export
          else
            uv run python -m app.jobs.fetch_pipeline
          fi

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage status files and lockfile (news.db is managed via releases)
          git add data/status uv.lock

          # Check if there are changes to commit (staged changes)
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            # Disconnect staged changes from index by storing in temp commit, then rebase
            git stash push -m "temp-stash" || true
            git pull --rebase || { echo "ERROR: Rebase conflict"; exit 1; }
            git stash pop || true
            git add data/status
            git commit -m "chore(data): save fetch pipeline progress" || { echo "ERROR: Commit failed"; exit 1; }
            git push || { echo "ERROR: Push failed"; exit 1; }
          fi

      - name: Upload news.db to release
        if: always()
        run: |
          if [ -s data/news.db ]; then
            gh release view news-db >/dev/null 2>&1 || gh release create news-db --title "News Database" --notes "Managed by pipeline workflows"
            gh release delete-asset news-db news.db --yes 2>/dev/null || true
            gh release upload news-db data/news.db --clobber
            echo "Uploaded news.db to release"
          else
            echo "news.db is empty; skipping upload"
          fi
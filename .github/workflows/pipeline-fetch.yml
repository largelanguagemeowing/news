name: pipeline-fetch
run-name: "fetch @ ${{ github.ref_name }}"

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      pipeline_source:
        description: "Which sources to fetch"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - openai-only
          - non-openai
          - microsoft-ai-blog
          - google-ai-blog
          - google-deepmind-blog
          - openai-blog
          - apple-machine-learning
          - simon-willison
          - cursor-blog
          - cursor-changelog
          - matt-wolfe
          - fireship
          - ai-explained
          - hugging-face
          - anthropic-news
          - anthropic-engineering
          - anthropic-research
          - claude-blog
          - thinking-machines
      export:
        description: "Export status files after fetch (enables feed dashboard)"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run fetch pipeline
        id: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: "INFO"
          PIPELINE_SOURCE_ID: >-
            ${{
              inputs.pipeline_source != 'all'
              && inputs.pipeline_source != 'openai-only'
              && inputs.pipeline_source != 'non-openai'
              && inputs.pipeline_source
              || ''
            }}
          PIPELINE_EXCLUDE_SOURCE: >-
            ${{
              inputs.pipeline_source == 'non-openai'
              && 'openai-blog'
              || ''
            }}
        run: |
          echo "Params: pipeline_source=${{ inputs.pipeline_source }}, export=${{ inputs.export }}"
          
          if [ "${{ inputs.pipeline_source }}" = "openai-only" ]; then
            export PIPELINE_SOURCE_ID="openai-blog"
          fi
          if [ "${{ inputs.export }}" = "true" ]; then
            uv run python -m app.jobs.fetch_pipeline --export
          else
            uv run python -m app.jobs.fetch_pipeline
          fi

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.db data/status
          
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git pull --rebase || { echo "ERROR: Rebase conflict"; exit 1; }
            git commit -m "chore(data): save fetch pipeline progress" || { echo "ERROR: Commit failed"; exit 1; }
            git push || { echo "ERROR: Push failed"; exit 1; }
          fi
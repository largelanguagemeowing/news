name: pipeline-classify
run-name: "classify @ ${{ github.ref_name }}"

on:
  workflow_dispatch:

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download news.db from release
        run: |
          mkdir -p data
          if gh release view news-db --json assets >/dev/null 2>&1; then
            gh release download news-db -p news.db -D data --clobber
            echo "Downloaded news.db ($(stat -c%s data/news.db) bytes)"
          else
            echo "No existing release found; starting with empty database"
            touch data/news.db
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run classify pipeline
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: "INFO"
        run: uv run python -m app.jobs.classify_pipeline

      - name: Commit and push data changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status
          
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git pull --rebase || { echo "ERROR: Rebase conflict"; exit 1; }
            git commit -m "chore(data): save classify pipeline progress" || { echo "ERROR: Commit failed"; exit 1; }
            git push || { echo "ERROR: Push failed"; exit 1; }
          fi

      - name: Upload news.db to release
        if: always()
        run: |
          if [ -s data/news.db ]; then
            gh release view news-db >/dev/null 2>&1 || gh release create news-db --title "News Database" --notes "Managed by pipeline workflows"
            gh release delete-asset news-db news.db --yes 2>/dev/null || true
            gh release upload news-db data/news.db --clobber
            echo "Uploaded news.db to release"
          else
            echo "news.db is empty; skipping upload"
          fi
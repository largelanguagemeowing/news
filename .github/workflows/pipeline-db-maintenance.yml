name: pipeline-db-maintenance
run-name: "db-maintenance @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: "Source whose articles to purge from the DB"
        required: true
        type: string

concurrency:
  group: news-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download news.db from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          if gh release view news-db --json assets >/dev/null 2>&1; then
            gh release download news-db -p news.db -D data --clobber
          else
            echo "No existing release found"; touch data/news.db
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Purge source articles
        run: uv run python -m app.jobs.purge_source --source-id "${{ inputs.source_id }}"

      - name: Upload news.db to release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s data/news.db ]; then
            gh release view news-db >/dev/null 2>&1 || gh release create news-db --title "News Database" --notes "Managed by pipeline workflows"
            gh release delete-asset news-db news.db --yes 2>/dev/null || true
            gh release upload news-db data/news.db --clobber
            echo "Uploaded news.db to release"
          fi
